<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 270" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Voice assistant workflow</title>
  <desc id="d">Voice input goes through speech-to-text to a LangGraph agent. The agent calls tools for web search and GPIO device control, then sends its reply through text-to-speech to a spoken response.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#64d8ff"/>
    </marker>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#64d8ff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="420" height="270" rx="14" fill="#0d1222"/>

  <!-- Connectors -->
  <g stroke="#64d8ff" stroke-width="1.4" fill="none" marker-end="url(#arrow)">
    <path d="M118 40 H141"/>
    <path d="M248 40 H271"/>
    <path d="M326 62 V105"/>
    <path d="M326 84 H196 V105"/>
    <path d="M378 40 H398 V218 H381"/>
    <path d="M271 218 H251"/>
  </g>

  <!-- Row 1 -->
  <g fill="#151e35" stroke="#64d8ff" stroke-opacity="0.4" stroke-width="1">
    <rect x="14" y="18" width="104" height="44" rx="10"/>
    <rect x="144" y="18" width="104" height="44" rx="10"/>
  </g>
  <rect x="274" y="18" width="104" height="44" rx="10" fill="#1b2447" stroke="url(#g)" stroke-width="1.6"/>

  <!-- Tools -->
  <g fill="#151e35" stroke="#a78bfa" stroke-opacity="0.55" stroke-width="1">
    <rect x="144" y="108" width="104" height="44" rx="10"/>
    <rect x="274" y="108" width="104" height="44" rx="10"/>
  </g>

  <!-- Output row -->
  <g fill="#151e35" stroke="#64d8ff" stroke-opacity="0.4" stroke-width="1">
    <rect x="274" y="196" width="104" height="44" rx="10"/>
    <rect x="144" y="196" width="104" height="44" rx="10"/>
  </g>

  <!-- Titles -->
  <g fill="#eef2ff" font-size="11.5" font-weight="700" text-anchor="middle">
    <text x="66" y="37">Voice input</text>
    <text x="196" y="37">Speech-to-text</text>
    <text x="326" y="37">LangGraph agent</text>
    <text x="196" y="127">Web search</text>
    <text x="326" y="127">Device control</text>
    <text x="326" y="215">Text-to-speech</text>
    <text x="196" y="215">Spoken reply</text>
  </g>

  <!-- Subtitles -->
  <g fill="#a1abc2" font-size="9.5" text-anchor="middle">
    <text x="66" y="52">Microphone</text>
    <text x="196" y="52">Whisper</text>
    <text x="326" y="52">LLM + tool routing</text>
    <text x="196" y="142">DuckDuckGo</text>
    <text x="326" y="142">GPIO lights, fan</text>
    <text x="326" y="230">Voice output</text>
    <text x="196" y="230">Speaker</text>
  </g>

  <!-- Notes -->
  <g fill="#a1abc2" font-size="9.5">
    <text x="232" y="78">tool calls</text>
    <text x="144" y="172" font-style="italic">tool results return to the agent</text>
    <text x="14" y="214">Runs on</text>
    <text x="14" y="228">Raspberry Pi</text>
  </g>
</svg>
